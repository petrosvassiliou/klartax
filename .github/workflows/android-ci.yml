name: Klartax Android & ChromeOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests (§ 32a EStG, EÜR, GoBD SHA-256 & EN 16931 E-Rechnung)
        run: gradle testDebugUnitTest

      - name: Assemble Debug APK (Android & ChromeOS)
        run: gradle assembleDebug
